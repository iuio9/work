# 大小模型协同训练配置
distillation:

  # ── 算法服务器（Training Agent）─────────────────────────────────────
  # 算法服务器上运行 training_agent.py 的地址
  # 单机开发时保持 localhost:5000；生产时改为算法服务器 IP
  agent:
    url: http://localhost:5000   # 生产示例: http://192.168.1.100:5000

  # ── Python 解释器（算法服务器上的路径）──────────────────────────────
  python:
    path: python3   # Linux: python3 或 /opt/conda/bin/python
                    # Windows: python 或 D:/venv/Scripts/python.exe

  # ── 训练脚本（算法服务器上的路径）──────────────────────────────────
  script:
    path: D:/pythonProject2/train_distillation.py

  qwen-script:
    path: D:/pythonProject2/train_qwen_vl_distillation.py

  student-only-script:
    path: D:/pythonProject2/train_student_only.py

  inference-script:
    path: D:/pythonProject2/inference_qwen_vl_distilled_models.py   # 算法服务器上的路径

  # ── 回调地址（存储服务器对外 IP，供训练脚本上报进度）────────────────
  # 算法服务器上的 Python 脚本用这个地址回调进度
  # 双服务器时填存储服务器的局域网 IP，例如 http://192.168.1.50:8080
  api:
    base-url: http://localhost:8080

  # ── 文件路径（算法服务器视角）────────────────────────────────────────
  # 双服务器时，建议通过 NFS 把存储服务器的目录挂载到算法服务器相同路径
  # 例如：存储服务器 /data/datasets  →  算法服务器 NFS 挂载到 /data/datasets
  models:
    root: D:/pythonProject2/models

  datasets:
    root: D:/pythonProject2/datasets

  output:
    root: D:/pythonProject2/training_output

# Spring 异步任务配置
spring:
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 10
